apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-node
  namespace: monitoring
data:
  node-disk-io.json: |
    {
      "title": "Node Disk I/O",
      "uid": "node-disk-io",
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "Disk I/O",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "title": "Disk read/write throughput",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "Bps" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(node_disk_read_bytes_total[$__rate_interval])",
              "legendFormat": "{{instance}} {{device}} read"
            },
            {
              "datasource": "Prometheus",
              "expr": "rate(node_disk_written_bytes_total[$__rate_interval])",
              "legendFormat": "{{instance}} {{device}} write"
            }
          ]
        },
        {
          "id": 3,
          "title": "Disk I/O saturation (% time busy)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0 }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(node_disk_io_time_seconds_total[$__rate_interval])",
              "legendFormat": "{{instance}} {{device}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Disk IOPS",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "iops" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(node_disk_reads_completed_total[$__rate_interval])",
              "legendFormat": "{{instance}} {{device}} reads"
            },
            {
              "datasource": "Prometheus",
              "expr": "rate(node_disk_writes_completed_total[$__rate_interval])",
              "legendFormat": "{{instance}} {{device}} writes"
            }
          ]
        }
      ]
    }
