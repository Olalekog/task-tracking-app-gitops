apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: task-tracking-app-uat
  namespace: argocd-ns
spec:
  project: default
  source:
    repoURL: https://github.com/Olalekog/task-tracking-app-gitops.git
    # TODO: point at the "uat" branch once real overlays/uat content is
    # promoted there via PR (that branch is currently empty). Using "dev"
    # for now so this Application can actually sync.
    targetRevision: dev
    path: overlays/uat
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

