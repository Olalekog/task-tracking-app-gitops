# DISCORD_WEBHOOK_URL is intentionally duplicated from the URL configured in
# alertmanager-deployment.yaml's Secret — Alertmanager embeds its webhook
# inside a YAML config blob rather than as a standalone key, so it can't be
# referenced directly from another pod's env. Keep both in sync if rotated.
#
# ANTHROPIC_API_KEY is left as a placeholder here (unlike the other real
# secrets in this repo) because GitHub's push protection blocks commits
# containing recognizable Anthropic key patterns. The real value is applied
# directly to the cluster instead — see docs/ARCHITECTURE-AND-MONITORING.md.
apiVersion: v1
kind: Secret
metadata:
  name: k8sgpt-secrets
  namespace: monitoring
type: Opaque
stringData:
  ANTHROPIC_API_KEY: change-me-anthropic-api-key
  DISCORD_WEBHOOK_URL: https://discordapp.com/api/webhooks/1528788955036778587/S8D0crrq9SgGyLliUY3EXKaPm4BjWxQ06bkNzbLO6SBgn-x1aOmb27J7KuRUJnxknxhl
