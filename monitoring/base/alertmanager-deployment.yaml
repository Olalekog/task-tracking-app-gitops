# This holds the Discord webhook URL, which is a bearer credential (anyone with
# it can post to the channel) — a Secret rather than a ConfigMap, following the
# same "change-me" placeholder convention as the other Secrets in this repo
# (base/mysql-secret.yaml, monitoring/base/elastic-secret.yaml). Replace
# CHANGE-ME-DISCORD-WEBHOOK below with a real webhook URL (Discord channel ->
# Edit Channel -> Integrations -> Webhooks -> New Webhook -> Copy Webhook URL).
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: discord
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    receivers:
      - name: discord
        discord_configs:
          - webhook_url: "https://discordapp.com/api/webhooks/1528785054673797270/0xDk1fjgxc1pDmfPIucFD7XgxWRz9gcsBhMBiMcLATBdq2tFqr58lu_hmfk_r4SJcP-a"
            send_resolved: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
            - name: storage
              mountPath: /alertmanager
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: config
          secret:
            secretName: alertmanager-config
        - name: storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: 9093
