apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8sgpt
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8sgpt
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - endpoints
      - events
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
      - namespaces
      - nodes
      - configmaps
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8sgpt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8sgpt
subjects:
  - kind: ServiceAccount
    name: k8sgpt
    namespace: monitoring
---
# Runs k8sgpt as a CronJob rather than the k8sgpt-operator (which needs its
# own CRDs + controller-manager installed first) — this repo doesn't use Helm
# for the app/monitoring stack, and a periodic scan-and-notify Job is a much
# smaller footprint than a full operator for what's needed here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8sgpt-scan
  namespace: monitoring
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: k8sgpt
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: k8sgpt-analyze
              # The official k8sgpt image (ghcr.io/k8sgpt-ai/k8sgpt) has no
              # shell at all ("sh: executable file not found") — found live
              # when this first crashed with Init:StartError. Using plain
              # alpine instead (ships sh/tar/wget via busybox, no `apk add`
              # needed, so it works under a strict non-root securityContext)
              # and downloading the k8sgpt binary at runtime. The
              # releases/latest/download URL always resolves to whatever's
              # newest — not pinned to a specific version.
              image: alpine:3.20
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: HOME
                  value: /tmp
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: k8sgpt-secrets
                      key: ANTHROPIC_API_KEY
              command:
                - sh
                - -c
                - |
                  set -eu
                  wget -q -O /tmp/k8sgpt.tar.gz https://github.com/k8sgpt-ai/k8sgpt/releases/latest/download/k8sgpt_Linux_x86_64.tar.gz
                  tar -xzf /tmp/k8sgpt.tar.gz -C /tmp
                  chmod +x /tmp/k8sgpt
                  /tmp/k8sgpt auth add --backend anthropic --model claude-3-5-sonnet-20241022 --password "$ANTHROPIC_API_KEY"
                  /tmp/k8sgpt analyze --explain --backend anthropic > /shared/result.txt 2>&1 || true
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: shared
                  mountPath: /shared
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          containers:
            - name: notify-discord
              # History of two fixes, both found live:
              # 1. Not curl+sed: hand-rolled shell JSON escaping missed
              #    backslashes/control characters and produced invalid JSON
              #    (curl exit 22). python's json.dumps escapes correctly.
              # 2. Not python's urllib either: even with a spoofed
              #    User-Agent header, Discord/Cloudflare returned 403 for
              #    requests sent via urlopen — apparently a TLS-level
              #    fingerprint check, not just the header. curl is the one
              #    client proven to work against this webhook in this repo's
              #    testing, but isn't installed here without apk (blocked by
              #    the strict non-root securityContext); wget (via busybox,
              #    already present, no install needed) is the next best bet.
              #    So: python builds the JSON (correct escaping), wget sends
              #    it (proven-workable transport).
              image: python:3.12-alpine
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
              env:
                - name: DISCORD_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: k8sgpt-secrets
                      key: DISCORD_WEBHOOK_URL
              command:
                - python3
                - -c
                - |
                  import json
                  import os
                  import subprocess
                  import sys

                  with open("/shared/result.txt") as f:
                      text = f.read()

                  if not text.strip() or "no problems detected" in text.lower():
                      print("No issues found, nothing to post.")
                      sys.exit(0)

                  body = text[:1800]
                  payload = json.dumps({
                      "content": "**k8sgpt cluster diagnostics**\n```\n" + body + "\n```"
                  })

                  with open("/tmp/payload.json", "w") as f:
                      f.write(payload)

                  subprocess.run(
                      [
                          "wget", "-q", "-O", "-",
                          "-U", "curl/8.11.0",
                          "--header=Content-Type: application/json",
                          "--post-file=/tmp/payload.json",
                          os.environ["DISCORD_WEBHOOK_URL"],
                      ],
                      check=True,
                  )
                  print("Posted to Discord.")
              volumeMounts:
                - name: shared
                  mountPath: /shared
              resources:
                requests:
                  cpu: 25m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
          volumes:
            - name: tmp
              emptyDir: {}
            - name: shared
              emptyDir: {}
