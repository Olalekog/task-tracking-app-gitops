apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: database
data:
  000-create-exporter-user.sql: |
    -- Note: docker-entrypoint-initdb.d scripts only run against a fresh,
    -- empty data directory. On an already-initialized volume, this user
    -- must be created manually (or via a migration job) instead.
    CREATE USER IF NOT EXISTS 'exporter'@'127.0.0.1' IDENTIFIED BY 'change-me-exporter';
    GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'exporter'@'127.0.0.1';
    GRANT SELECT ON performance_schema.* TO 'exporter'@'127.0.0.1';
    FLUSH PRIVILEGES;
  001-seed-tasks.sql: |
    CREATE TABLE IF NOT EXISTS tasks (
      id INT NOT NULL AUTO_INCREMENT,
      title VARCHAR(160) NOT NULL,
      description TEXT NULL,
      status VARCHAR(32) NOT NULL DEFAULT 'todo',
      owner VARCHAR(120) NULL,
      created_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP,
      updated_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP ON UPDATE CURRENT_TIMESTAMP,
      PRIMARY KEY (id),
      INDEX ix_tasks_id (id)
    );

    INSERT IGNORE INTO tasks (id, title, description, status, owner, created_at, updated_at)
    VALUES
      (
        1,
        'Review deployment checklist',
        'Confirm manifests, secrets, and image tags before the next rollout.',
        'todo',
        'Olalekan',
        UTC_TIMESTAMP(),
        UTC_TIMESTAMP()
      ),
      (
        2,
        'Connect frontend to backend API',
        'Verify task creation and status updates from the React interface.',
        'in_progress',
        'Platform Team',
        UTC_TIMESTAMP(),
        UTC_TIMESTAMP()
      ),
      (
        3,
        'Provision UAT infrastructure',
        'Run Terraform for the UAT environment and capture the generated outputs.',
        'done',
        'Cloud Team',
        UTC_TIMESTAMP(),
        UTC_TIMESTAMP()
      );
