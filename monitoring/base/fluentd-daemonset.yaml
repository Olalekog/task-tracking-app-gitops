apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      serviceAccountName: fluentd
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.18-debian-elasticsearch8-1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: FLUENT_ELASTICSEARCH_HOST
              value: elasticsearch.monitoring.svc.cluster.local
            - name: FLUENT_ELASTICSEARCH_PORT
              value: "9200"
            # These nodes run containerd, not Docker, so the journald/systemd
            # log source (which needs to write a cursor file under the
            # read-only-for-us /var/log hostPath) must be disabled.
            - name: FLUENTD_SYSTEMD_CONF
              value: disable
          volumeMounts:
            - name: varlog
              mountPath: /var/log
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: monitoring
