apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backend
  namespace: monitoring
data:
  task-tracking-backend.json: |
    {
      "title": "Task Tracking Backend",
      "uid": "task-tracking-backend",
      "schemaVersion": 39,
      "version": 1,
      "timezone": "browser",
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Traffic",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "title": "Request rate by handler",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (handler) (rate(http_requests_total[$__rate_interval]))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Non-2xx response rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (handler, status) (rate(http_requests_total{status!~\"2..\"}[$__rate_interval]))",
              "legendFormat": "{{handler}} ({{status}})"
            }
          ]
        },
        {
          "id": 4,
          "title": "p95 latency by handler",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.95, sum by (handler, le) (rate(http_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{handler}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "p99 latency (overall)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_highr_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 6,
          "title": "Application Metrics",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 }
        },
        {
          "id": 7,
          "title": "Tasks created",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 18 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "increase(task_tracking_tasks_created_total[$__range])",
              "legendFormat": "created"
            }
          ]
        },
        {
          "id": 8,
          "title": "Tasks updated",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 18 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "increase(task_tracking_tasks_updated_total[$__range])",
              "legendFormat": "updated"
            }
          ]
        },
        {
          "id": 9,
          "title": "Tasks deleted",
          "type": "stat",
          "datasource": "Prometheus",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 18 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "increase(task_tracking_tasks_deleted_total[$__range])",
              "legendFormat": "deleted"
            }
          ]
        },
        {
          "id": 10,
          "title": "Task mutation rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(task_tracking_tasks_created_total[$__rate_interval])",
              "legendFormat": "created"
            },
            {
              "datasource": "Prometheus",
              "expr": "rate(task_tracking_tasks_updated_total[$__rate_interval])",
              "legendFormat": "updated"
            },
            {
              "datasource": "Prometheus",
              "expr": "rate(task_tracking_tasks_deleted_total[$__rate_interval])",
              "legendFormat": "deleted"
            }
          ]
        },
        {
          "id": 11,
          "title": "Process Health",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 }
        },
        {
          "id": 12,
          "title": "Resident memory by pod",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 33 },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "process_resident_memory_bytes{job=\"kubernetes-pods\"}",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 13,
          "title": "CPU usage by pod",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 33 },
          "fieldConfig": { "defaults": { "unit": "percentunit" }, "overrides": [] },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "rate(process_cpu_seconds_total{job=\"kubernetes-pods\"}[$__rate_interval])",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 14,
          "title": "Open file descriptors by pod",
          "type": "timeseries",
          "datasource": "Prometheus",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 33 },
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "process_open_fds{job=\"kubernetes-pods\"}",
              "legendFormat": "{{instance}}"
            }
          ]
        }
      ]
    }
